<style>
  :root { --bg:#f5f4f8; --card:#fff; --ink:#1d1b24; --muted:#6b6878; --line:#dcd9e5; --accent:#5b4bdb; --err:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121118; --card:#1c1a24; --ink:#efedf5; --muted:#a19db0; --line:#34313f; --accent:#9b8cff; --err:#ff7b6b; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; text-align:center; }
  .lock { font-size:34px; }
  h1 { font-size:20px; margin:8px 0 4px; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  input[type=password] { width:100%; padding:12px 14px; font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:10px; }
  input[type=password]:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  label.rem { display:flex; gap:8px; align-items:center; justify-content:center; margin:12px 0 0; font-size:14px; color:var(--muted); }
  button { width:100%; margin-top:16px; padding:12px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { min-height:20px; margin-top:10px; font-size:14px; color:var(--err); }
</style>

async function decrypt(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.i) }, key, u8(P.c)); // throws on a wrong password
  const raw = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(raw));
}

function render(site) {
  const urls = {}, paths = Object.keys(site.files).filter(p => p !== site.entry).sort((a, b) => b.length - a.length);
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const rewrite = txt => paths.reduce((t, p) => urls[p] ? t.replace(new RegExp('(["\'(=\\s])(?:\\./)?' + reEsc(p) + '(?:\\?[^"\'()\\s>]*)?(?=["\')\\s>])', 'g'), '$1' + urls[p]) : t, txt);
  const blob = (f, body) => URL.createObjectURL(new Blob([body], { type: f.type }));
  for (const p of paths) { const f = site.files[p]; if (f.b64 !== undefined) urls[p] = blob(f, u8(f.b64)); }
  for (const p of paths) { const f = site.files[p]; if (f.text !== undefined && /svg/.test(f.type)) urls[p] = blob(f, f.text); }
  for (const p of paths) { const f = site.files[p]; if (f.text !== undefined && !/svg/.test(f.type)) urls[p] = blob(f, rewrite(f.text)); }
  // The locked site has no offline cache: block service workers so they can't cache or reload the page.
  const noSW = '<script>try{if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));navigator.serviceWorker.register=()=>Promise.reject(new Error("off"));}}catch(e){}<\/script>';
  let html = rewrite(site.files[site.entry].text);
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + noSW) : noSW + html;
  document.open(); document.write(html); document.close();
}

async function unlock(pw, remember) {
  const site = await decrypt(pw);
  try { remember ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch (e) {}
  render(site);
}

const form = document.getElementById('gate'), err = document.getElementById('err'), go = document.getElementById('go');
form.addEventListener('submit', async e => {
  e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Opening…';
  try { await unlock(document.getElementById('pw').value, document.getElementById('rem').checked); }
  catch (x) { err.textContent = 'Wrong password. Try again.'; go.disabled = false; go.textContent = 'Open'; document.getElementById('pw').select(); }
});
(async () => { let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) { try { await unlock(saved, true); } catch (e) { try { localStorage.removeItem(KEY); } catch (_) {} } } })();
})();
